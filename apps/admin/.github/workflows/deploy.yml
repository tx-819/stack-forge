name: Build, push Docker Hub, deploy ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 与 Docker Hub 上的仓库名一致；若不同请改这里或改用仓库 Variables
  IMAGE_NAME: react-admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 前置条件：服务器 ~/edge/ 上的 caddy-docker-proxy 已启动，并且 docker 网络 "edge" 已存在。
      # Secrets：DOCKERHUB_*、SSH_*、DEPLOY_PATH、SSL_DOMAIN（本项目对外的域名，如 admin.example.com）
      - name: Copy compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}/

      - name: Deploy on ECS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            cat > .env <<EOF
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            SSL_DOMAIN=${{ secrets.SSL_DOMAIN }}
            BACKEND_UPSTREAM=${{ secrets.BACKEND_UPSTREAM }}
            EOF
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
