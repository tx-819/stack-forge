# 服务器侧 compose：与本机 deploy/local/deploy.sh 及服务器 .env 配合（DOCKER_IMAGE、BACKEND_UPSTREAM 等）。
# 本服务不绑定宿主机端口；由 edge 的 nginx 将 80/443 反代到本容器 expose 的 80。
# 域名与 TLS 在仓库根 deploy/edge 中配置；业务侧仅需接入 edge 网络并保持容器名稳定（如 react-admin）。
services:
  web:
    image: ${DOCKER_IMAGE}
    container_name: react-admin
    expose:
      - "80"
    environment:
      # 后端 API 上游地址，由应用内 nginx 反向代理使用。
      # 形如 http://<后端容器名>:<端口>，例如 http://backend:8000
      # 后端容器需要同样加入 edge 网络才能用容器名互通。
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM}
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    external: true
    name: edge
